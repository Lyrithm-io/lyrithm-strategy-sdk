name: macd-divergence
display_name: "MACD Divergence — momentum-leads-price reversal"
language: python
entrypoint: strategy.py
version: 0.1.0
description: |
  Detects bullish + bearish MACD-histogram divergences over a rolling
  window. Long when price prints a fresh low but the histogram trails
  higher (momentum didn't confirm); short on the symmetric high.
  Inline EMA(12)/EMA(26)/Signal(9) MACD computation keeps the file
  self-contained. ATR stop, generous 2.5 R:R for divergence trades,
  conservative 3x leverage cap.
author: "Lyrithm Examples"
tags: [example, intermediate, divergence, macd, momentum, reversal]
source_visibility: open
config_schema: config_schema.json
default_config:
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  atr_period: 14
  divergence_lookback: 20
  stop_atr_mult: 2.0
  reward_ratio: 2.5
  leverage: 3
