name: tests

# Runs the SDK pytest suite in CI. This repo had no workflow at all, so the
# public strategy-authoring contract (indicators, manifest, pine runtime,
# backtest) — the surface VERSIONING.md promises to keep stable (API-004) —
# was only ever verified on a contributor's machine.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: python
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install package + test extras
        run: pip install -e ".[test]"

      - name: Run pytest
        run: pytest -q
