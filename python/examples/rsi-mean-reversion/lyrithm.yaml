name: rsi-mean-reversion
display_name: "RSI Mean Reversion — fade the extreme"
language: python
entrypoint: strategy.py
version: 0.1.0
description: |
  Wilder RSI cross-back mean reversion. Buys when RSI rises BACK ABOVE the
  oversold threshold (default 30) the bar after printing oversold, sells
  the symmetric overbought-rejection. ATR stop, modest reward ratio (1.5),
  conservative 3x leverage cap. Pairs naturally with sma-crossover (trend)
  for an A/B regime comparison on the same instrument.
author: "Lyrithm Examples"
tags: [example, beginner, mean-reversion, rsi]
source_visibility: open
config_schema: config_schema.json
default_config:
  rsi_period: 14
  atr_period: 14
  oversold_threshold: 30.0
  overbought_threshold: 70.0
  stop_atr_mult: 2.0
  reward_ratio: 1.5
  leverage: 3
