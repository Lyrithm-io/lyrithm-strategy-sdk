name: tests

# Runs the SDK pytest suite in CI. This repo had no workflow at all, so the
# public strategy-authoring contract (indicators, manifest, pine runtime,
# backtest) — the surface VERSIONING.md promises to keep stable (API-004) —
# was only ever verified on a contributor's machine.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: python
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install package + test extras
        run: pip install -e ".[test]"

      - name: Run pytest
        run: pytest -q
